name: swift

on:
  push:
    paths: ["swift/**", "spec/**", ".github/workflows/swift.yml"]
  pull_request:
    paths: ["swift/**", "spec/**", ".github/workflows/swift.yml"]

jobs:
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Generated command table is current
        run: cd swift && swift run gen && git config --global --add safe.directory "$GITHUB_WORKSPACE" && git diff --exit-code -- Sources/ZBC/CommandsGen.swift
      - name: Every vector through the library and the CLI
        run: cd swift && swift test -c release
      - name: Release build runs
        run: cd swift && swift build -c release && .build/release/zbc-cli list | head -1
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every vector on macOS (CryptoKit)
        run: cd swift && swift test -c release
