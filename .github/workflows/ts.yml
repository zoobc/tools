name: ts

on:
  push:
    paths: ["ts/**", "js/**", "spec/**", ".github/workflows/ts.yml"]
  pull_request:
    paths: ["ts/**", "js/**", "spec/**", ".github/workflows/ts.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dev dependencies
        run: cd ts && npm ci
      - name: The command table is current
        run: cd ts && node scripts/gen-commands.mjs && git diff --exit-code -- src/generated
      - name: Build and run every vector
        run: cd ts && npm test
      - name: The browser bundle is current and loads
        run: cd ts && npm run bundle && git diff --exit-code -- ../js/zbc.js && node ../js/test.cjs
