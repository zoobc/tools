# Copyright (c) 2024-2026 ZooBC Foundation and Roberto Capodieci
#
# A version tag (v0.1.0) packages every port, publishes each one where the repository holds the
# registry's secret, and attaches every package to a GitHub release. A job whose secret is missing
# still builds and packs, prints a notice and ends green, so a tag never fails for want of an
# account: add the secret, re-run the job. docs/PUBLISHING.md lists the secrets and the accounts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Build, test and pack @zoobc/tools
        run: cd ts && npm ci && npm test && npm pack
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then echo "::notice::NPM_TOKEN is not set: npm publish skipped, the package was built and packed"; exit 0; fi
          cd ts && npm publish --access public
      - uses: actions/upload-artifact@v4
        with:
          name: npm
          path: |
            ts/*.tgz
            js/zbc.js

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build zbc-tools (sdist and wheel)
        run: cd py && python3 -m unittest && pip install --quiet build twine && python3 -m build && twine check dist/*
      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "$TWINE_PASSWORD" ]; then echo "::notice::PYPI_API_TOKEN is not set: PyPI upload skipped, the distributions were built"; exit 0; fi
          cd py && twine upload dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi
          path: py/dist/*

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test and package the zbc crate
        run: cd rust && cargo test --release && cargo publish --dry-run -p zbc
      - name: Publish zbc and zbc-cli to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "::notice::CARGO_REGISTRY_TOKEN is not set: crates.io publish skipped, the crate was packaged"; exit 0; fi
          cd rust && cargo publish -p zbc && sleep 60 && cargo publish -p zbc-cli

  maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"
      - name: Test and publish foundation.zoobc:zbc to the local repository
        run: cd kotlin && gradle --no-daemon test publishToMavenLocal
      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.MAVEN_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
        run: |
          if [ -z "$ORG_GRADLE_PROJECT_mavenCentralUsername" ] || [ -z "$ORG_GRADLE_PROJECT_signingInMemoryKey" ]; then echo "::notice::MAVEN_CENTRAL_USERNAME / MAVEN_SIGNING_KEY are not set: Maven Central publish skipped, the artifacts were built"; exit 0; fi
          cd kotlin && gradle --no-daemon publishToMavenCentral --no-configuration-cache
      - uses: actions/upload-artifact@v4
        with:
          name: maven
          path: ~/.m2/repository/foundation/zoobc/zbc/*/*

  cpan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test and build the ZBC distribution
        run: cd perl && prove -l t && perl Makefile.PL && make dist
      - name: Upload to PAUSE (CPAN)
        env:
          PAUSE_USERNAME: ${{ secrets.PAUSE_USERNAME }}
          PAUSE_PASSWORD: ${{ secrets.PAUSE_PASSWORD }}
        run: |
          if [ -z "$PAUSE_USERNAME" ]; then echo "::notice::PAUSE_USERNAME is not set: CPAN upload skipped, the tarball was built"; exit 0; fi
          sudo apt-get install -y --no-install-recommends cpanminus && sudo cpanm --quiet --notest CPAN::Uploader
          cd perl && cpan-upload -u "$PAUSE_USERNAME" -p "$PAUSE_PASSWORD" ZBC-*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: cpan
          path: perl/ZBC-*.tar.gz

  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: sodium
          tools: composer
      - name: Validate zoobc/zbc-tools (Packagist reads the tag from GitHub, nothing to upload)
        run: cd php && php tests/run.php && composer validate --strict

  github-release:
    needs: [npm, pypi, crates, maven, cpan, composer]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Attach every package to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qr artifacts/zbc-cpp-sources-${GITHUB_REF_NAME}.zip cpp
          zip -qr artifacts/zbc-spec-${GITHUB_REF_NAME}.zip spec
          gh release create "$GITHUB_REF_NAME" --title "ZooBC tools $GITHUB_REF_NAME" --generate-notes $(find artifacts -type f)
