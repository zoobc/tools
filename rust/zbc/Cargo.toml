[package]
name = "zbc"
description = "ZooBC keys, addresses, transaction signing, the node client and the zbc-cli command line"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
blake2 = "0.10"
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
salsa20 = "0.10"
crypto_secretbox = { version = "0.1", features = ["salsa20"] }
rand_core = { version = "0.6", features = ["getrandom"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
